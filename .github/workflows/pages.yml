name: Publish web app (iPhone)

# Веб-версия ZhukoGPT для iPhone публикуется на GitHub Pages: https://bobopsya.github.io/zhukoGPT/
# Один раз в настройках репозитория: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main, claude/zhukogpt-ai-assistant-flzt2a]
    paths: ["web/**", "zhukogpt/config.py", "zhukogpt/logo.py", "make_web_config.py", "make_icon.py",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PySide6 (for the icon)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install "PySide6>=6.5"

      # Промпты и сервисы берутся из zhukogpt/config.py, иконка — тот же жук, что у exe.
      - name: Build config and icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python make_web_config.py
          python make_icon.py

      - name: Check scripts
        run: for f in web/*.js; do node --check "$f"; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
